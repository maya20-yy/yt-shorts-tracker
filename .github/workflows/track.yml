name: Track YouTube Shorts Views

on:
  schedule:
    # Runs twice an hour (at 12 and 42 minutes past the hour, spaced 30 minutes apart)
    - cron: '12,42 * * * *'
  workflow_dispatch:          # Allows you to run it manually anytime from GitHub

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests supabase pandas

      - name: Run tracker script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python track.py
